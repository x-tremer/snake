<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Classic Snake game — play solo or two players. Runs everywhere." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <title>Snake</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: #fff;
      font-family: sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      background: #000;
      image-rendering: pixelated;
    }
    #login-input {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 10px;
      color: #32cd32;
      font-family: monospace;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      outline: none;
      z-index: 1001;
      display: none;
    }
    #login-input:focus {
      border-color: #32cd32;
    }
    #login-input::placeholder {
      color: #555;
      letter-spacing: 1px;
    }
    #login-submit {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      padding: 10px 0;
      background: #32cd32;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      z-index: 1001;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="600" height="600"></canvas>
  <input id="login-input" type="text" maxlength="12" placeholder="SNAKE-______" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" />
  <button id="login-submit">Enter</button>
  <script>
    // Register service worker for PWA offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
