<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Classic Snake game — solo or two players. Everywhere." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <title>Snake</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      color: #fff; font-family: sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
    }
    #app-shell {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%; height: 100dvh;
      gap: 8px;
    }
    #game-area {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      max-height: calc(100% - 196px);
    }
    canvas {
      background: #000;
      image-rendering: pixelated;
      max-width: 100%; max-height: 100%;
    }
    #controls-area {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
      min-height: 188px;
    }
    #dpad {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 240px;
    }
    #dpad button {
      width: 60px; height: 60px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #ccc; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #dpad button:active {
      background: rgba(50,205,50,0.4);
      border-color: rgba(50,205,50,0.6);
      color: #32cd32;
    }
    #dpad .empty { width: 60px; height: 60px; visibility: hidden; pointer-events: none; }
    #login-input {
      display: none;
      width: 220px; padding: 12px 16px;
      background: #1a1a1a; border: 2px solid #444; border-radius: 10px;
      color: #32cd32; font-family: monospace; font-size: 18px;
      text-align: center; text-transform: uppercase; letter-spacing: 2px;
      outline: none;
    }
    #login-input:focus { border-color: #32cd32; }
    #login-input::placeholder { color: #555; letter-spacing: 1px; }
    #login-submit {
      display: none;
      width: 220px; padding: 10px 0;
      background: #32cd32; color: #000; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app-shell">
  <div id="game-area">
    <canvas id="game-canvas" width="600" height="600"></canvas>
  </div>
  <div id="controls-area">
    <input id="login-input" type="text" maxlength="13" placeholder="SNAKE-______"
           autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" />
    <button id="login-submit">Enter</button>
    <div id="dpad">
      <button class="empty" aria-hidden="true" disabled></button>
      <button data-action="UP">▲</button>
      <button class="empty" aria-hidden="true" disabled></button>
      <button data-action="LEFT">◄</button>
      <button class="empty" aria-hidden="true" disabled></button>
      <button data-action="RIGHT">►</button>
      <button class="empty" aria-hidden="true" disabled></button>
      <button data-action="DOWN">▼</button>
      <button class="empty" aria-hidden="true" disabled></button>
    </div>
  </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    });
  }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
